<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Onipaba Music Member</title>
    <meta name="description"
        content="Sign in to your Onipaba Music account to access your profile and community features.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://onipabamusic.vercel.app/login.html">
    <meta property="og:title" content="Login - Onipaba Music">
    <meta property="og:description" content="Sign in to your member account on Onipaba Music.">
    <meta property="og:image" content="https://onipabamusic.vercel.app/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Login - Onipaba Music">
    <meta property="twitter:description" content="Sign in to your member account on Onipaba Music.">
    <meta property="twitter:image" content="https://onipabamusic.vercel.app/og-image.png">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <script type="module" src="firebase-config.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            font-family: var(--font-body);
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
        }

        .login-card {
            background: var(--color-bg-secondary);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 3rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header h1 {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--color-gold-primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--color-text-secondary);
            font-size: 0.95rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            color: var(--color-text-primary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            padding: 0.875rem;
            background: var(--color-bg-tertiary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--color-text-primary);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: var(--transition-fast);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-gold-primary);
            background: rgba(212, 175, 55, 0.05);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .remember-me label {
            color: var(--color-text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .login-btn {
            padding: 1rem;
            background: linear-gradient(135deg, var(--color-gold-primary) 0%, #c9a959 100%);
            border: none;
            border-radius: 6px;
            color: var(--color-bg-primary);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            padding: 0.875rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            color: #ef4444;
            font-size: 0.9rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
        }

        .back-link a {
            color: var(--color-gold-primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: var(--color-gold-secondary);
        }
    </style>
</head>

<body>
    <!-- Auth Loading Overlay -->
    <div id="auth-loading-overlay">
        <div class="auth-loader-spinner"></div>
        <div class="auth-loader-text">Verifying Session...</div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <img src="images/logo-v2.jpg" alt="Onipaba Music"
                style="height: 80px; width: 80px; object-fit: cover; border-radius: 50%; margin-bottom: 0.5rem;">
            <p>Sign in to your account</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="admin@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password"
                    autocomplete="current-password">
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Remember me</label>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="back-link">
            <p style="color: var(--color-text-secondary); margin-bottom: 1rem;">Don't have an account? <a
                    href="signup.html">Sign Up</a></p>
            <a href="index.html">← Back to website</a>
        </div>
    </div>
    </div>

    <script type="module" src="auth.js"></script>
</body>

</html>
